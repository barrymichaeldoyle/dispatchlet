name: audit

# Advisories arrive on their own schedule, not with your commits, so this runs weekly rather
# than in the pre-commit hook, where a fresh advisory would block an unrelated change.
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        id: audit
        run: |
          if pnpm audit --audit-level low >audit.txt 2>&1; then
            echo 'clean=true' >>"$GITHUB_OUTPUT"
          else
            echo 'clean=false' >>"$GITHUB_OUTPUT"
          fi
          cat audit.txt
      - name: Report advisories on an issue
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: pnpm audit found advisories
        run: |
          body=$(
            printf 'The weekly audit found advisories. Reproduce with `pnpm audit --audit-level low`.\n\n```\n'
            head -c 50000 audit.txt
            printf '\n```\n\n[Run log](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          )
          existing=$(
            gh issue list --state open --search "$TITLE in:title" \
              --json number,title --jq "map(select(.title == \"$TITLE\")) | first | .number // empty"
          )
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
