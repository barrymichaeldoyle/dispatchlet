name: e2e

on:
  push:
    branches: [main]
  schedule:
    # An odd minute off the hour: GitHub's scheduled queue is worst at :00, and this job
    # exists to catch an overnight production break before the morning, not after it.
    - cron: '37 1 * * *'

permissions:
  contents: read
  checks: read

# A newer push supersedes an in-flight run: both test the same production URL.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The browser download is cacheable; the OS packages it needs are not, so a hit still
      # installs those and only a miss pays for the download.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Wait for Cloudflare deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cloudflare builds have taken over ten minutes; wait up to thirty.
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '
              [.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Workers Builds: dispatchlet")]
              | first
              | if . == null or .status != "completed" then "pending" else .conclusion end
            ')
            case "$result" in
              success) exit 0 ;;
              pending) echo "Waiting for Cloudflare build ($attempt/120)"; sleep 15 ;;
              *) echo "Cloudflare deployment finished with: $result"; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Cloudflare deployment"
          exit 1
      - run: pnpm e2e
        env:
          E2E_BASE_URL: https://dispatchlet.com
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
