name: e2e

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  checks: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Cloudflare deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '
              [.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Workers Builds: dispatchlet")]
              | first
              | if . == null or .status != "completed" then "pending" else .conclusion end
            ')
            case "$result" in
              success) exit 0 ;;
              pending) echo "Waiting for Cloudflare build ($attempt/60)"; sleep 10 ;;
              *) echo "Cloudflare deployment finished with: $result"; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Cloudflare deployment"
          exit 1
      - run: pnpm e2e
        env:
          E2E_BASE_URL: https://dispatchlet.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
